services:
  hello-node:
    build: ./node
    image: hamz45/hello-node
    ports:
      - "8080:8080"
    environment:
      - ENV_VALUE=${ENV_VALUE}
      - PORT=8080

  hello-springboot-hello-spring:
    build: ./springboot/hello-spring
    image: hamz45/hello-spring
    ports:
      - "3000:3000"
    environment:
      - ENV_VALUE=${ENV_VALUE}
      - SERVER_PORT=3000