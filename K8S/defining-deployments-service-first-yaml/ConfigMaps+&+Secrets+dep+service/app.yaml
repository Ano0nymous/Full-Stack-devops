apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: nginx
          ports:
            - containerPort: 80
          env:
          - name: APP_MESSAGE
            valueFrom:
             configMapKeyRef:
              name: app-config
              key: APP_MESSAGE
          - name: DB_PASSWORD
            valueFrom:
             secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
          
               
      
             

---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: myapp
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
