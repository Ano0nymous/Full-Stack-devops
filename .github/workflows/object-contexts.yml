# .github/workflows/demo-context-objects.yml
name: Demo Context Objects

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:          # allow manual trigger

jobs:
  # ------------------------------------------------------------------
  # Job 1: Explore GitHub & Runner contexts
  # ------------------------------------------------------------------
  explore-contexts:
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub context object
        run: |
          echo "github.ref          = ${{ github.ref }}"
          echo "github.ref_name     = ${{ github.ref_name }}"
          echo "github.ref_type     = ${{ github.ref_type }}"
          echo "github.sha          = ${{ github.sha }}"
          echo "github.event_name   = ${{ github.event_name }}"
          echo "github.actor        = ${{ github.actor }}"
          echo "github.repository   = ${{ github.repository }}"
          echo "github.workspace    = ${{ github.workspace }}"
          echo "github.job          = ${{ github.job }}"
          echo "github.run_id       = ${{ github.run_id }}"
          echo "github.run_number   = ${{ github.run_number }}"
          echo "github.event.pull_request.title = ${{ github.event.pull_request.title }}"

      - name: Show Runner context object
        run: |
          echo "runner.os           = ${{ runner.os }}"
          echo "runner.arch         = ${{ runner.arch }}"
          echo "runner.temp         = ${{ runner.temp }}"
          echo "runner.tool_cache   = ${{ runner.tool_cache }}"

      - name: Show Secrets context (masked)
        run: |
          echo "secrets.GITHUB_TOKEN (exists) = ${{ secrets.GITHUB_TOKEN != '' }}"
          # never echo real secret value; just check existence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Job 2: Matrix strategy using runner.os and more
  # ------------------------------------------------------------------
  matrix-demo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
        exclude:
          - os: windows-latest
            node-version: 16   # skip windows+node16
    steps:
      - name: Show matrix values
        run: |
          echo "matrix.os           = ${{ matrix.os }}"
          echo "matrix.node-version= ${{ matrix.node-version }}"
          echo "runner.os          = ${{ runner.os }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

  # ------------------------------------------------------------------
  # Job 3: Environment & Variables contexts
  # ------------------------------------------------------------------
  env-vars-demo:
    runs-on: ubuntu-latest
    environment: 
      name: staging   # requires an environment defined in repo
    env:
      APP_ENV: staging
      LOG_LEVEL: debug
    steps:
      - name: Show env context
        run: |
          echo "env.APP_ENV   = ${{ env.APP_ENV }}"
          echo "env.LOG_LEVEL = ${{ env.LOG_LEVEL }}"
          echo "vars.MY_CUSTOM_VAR = ${{ vars.MY_CUSTOM_VAR }}"   # repository variable

  # ------------------------------------------------------------------
  # Job 4: Job outputs and needs context
  # ------------------------------------------------------------------
  generate-output:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.set-timestamp.outputs.timestamp }}
      branch-name: ${{ steps.extract-branch.outputs.branch }}
    steps:
      - name: Set timestamp output
        id: set-timestamp
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

  consume-outputs:
    runs-on: ubuntu-latest
    needs: [generate-output]
    steps:
      - name: Use outputs from previous job
        run: |
          echo "needs.generate-output.outputs.timestamp = ${{ needs.generate-output.outputs.timestamp }}"
          echo "needs.generate-output.outputs.branch-name = ${{ needs.generate-output.outputs.branch-name }}"

  # ------------------------------------------------------------------
  # Job 5: GitHub object inside conditionals & expressions
  # ------------------------------------------------------------------
  conditional-demo:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: This only runs on main branch via push
        run: echo "Condition matched! github.ref=${{ github.ref }}"

  # ------------------------------------------------------------------
  # Job 6: Use runner.os to set platform-specific paths
  # ------------------------------------------------------------------
  platform-paths:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Set OS-specific directory
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "C:\\tools" >> $GITHUB_PATH
          else
            echo "/usr/local/bin" >> $GITHUB_PATH
          fi
        shell: bash

      - name: Show effective PATH
        run: echo "$PATH"

  # ------------------------------------------------------------------
  # Job 7: Using github.event context for PR info
  # ------------------------------------------------------------------
  pr-context:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: PR title and author
        run: |
          echo "PR #${{ github.event.pull_request.number }}"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"

  # ------------------------------------------------------------------
  # Job 8: Reusable workflow call with context passing (demo)
  # ------------------------------------------------------------------
  call-reusable:
    runs-on: ubuntu-latest
    steps:
      - name: Call reusable workflow example
        uses: ./.github/workflows/reusable-demo.yml
        with:
          caller-ref: ${{ github.ref }}
          caller-runner: ${{ runner.os }}